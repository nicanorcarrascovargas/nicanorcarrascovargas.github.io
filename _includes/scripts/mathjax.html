{% if site.enable_math %}
<script>
window.MathJax = {
  tex: {tags: 'ams', inlineMath: [['$', '$'], ['\\(', '\\)']], processEscapes: true},
  svg: {fontCache: 'global'},
  options: {enableMenu: false},
  loader: {paths: {mathjax: "{{ '/assets/js/vendor/mathjax' | relative_url }}"}}
};
</script>
<script defer src="{{ '/assets/js/vendor/mathjax/tex-svg-full.js' | relative_url }}"></script>
{% endif %}
